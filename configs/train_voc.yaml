# 模型与数据
model: yolo11n.pt
data: VOC.yaml
nc: 20

# 训练规模
epochs: 60
imgsz: 640
batch: 1
workers: 8
device: 0

# 优化器
optimizer: AdamW          # SGD | AdamW
lr0: 0.001
momentum: 0.937
weight_decay: 0.0005
scheduler: cosine       # cosine | step | none
warmup_epochs: 3

# 训练控制
amp: true
clip_grad: 10.0
close_mosaic_epochs: 10   # 最后 N 个 epoch 关闭 mosaic，0 表示不关

# 输出
project: runs/detect
name: voc_yolo11n_custom_loop
seed: 0